name: Emulator host tools
on:
  push:
    paths: ['tools/*emulator*.py', 'tools/uconsole_workbench.py', 'tests/test_emulator*.py', '.github/workflows/emulator.yml']
  pull_request:
    paths: ['tools/*emulator*.py', 'tools/uconsole_workbench.py', 'tests/test_emulator*.py', '.github/workflows/emulator.yml']
permissions:
  contents: read
jobs:
  portable-tools:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_emulator.py -v
