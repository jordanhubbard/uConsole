name: Host CI

on:
  workflow_call:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  linux:
    name: Linux tests and GUI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: sudo apt-get update && sudo apt-get install -y shellcheck xvfb python3-tk qemu-utils dosfstools e2fsprogs libasound2-dev
      - name: Run complete tests with GUI and shell checks
        timeout-minutes: 20
        run: xvfb-run -a make check PYTHON=/usr/bin/python3

  macos:
    name: macOS complete tests and GUI
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install native test dependencies
        run: brew install shellcheck python-tk@3.12 qemu dosfstools e2fsprogs
      - name: Run complete tests and shell checks
        timeout-minutes: 20
        run: make check PYTHON="$(brew --prefix)/bin/python3.12"

  windows:
    name: Windows host-tool portability
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -p test_emulator.py -v

  qemu-models:
    name: Native QEMU Pi5 memory and boot models
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install QEMU build dependencies
        run: sudo apt-get update && sudo apt-get install -y ninja-build pkg-config libglib2.0-dev libpixman-1-dev libslirp-dev python3-venv
      - name: Build the complete pinned model stack
        run: python3 tools/build_emulator_qemu.py --jobs 4 > qemu-build.log 2>&1
      - name: Exercise actual Pi5 boot and memory models
        run: |
          python3 tools/test_emulator_pi5_boot.py --qemu build/emulator/qemu-build/qemu-system-aarch64 > pi5-boot.log 2>&1
          python3 tools/test_emulator_pi5_memory.py --qemu build/emulator/qemu-build/qemu-system-aarch64 --output _build/pi5-memory > pi5-memory.log 2>&1
          python3 tools/test_prepare_pi5_boot.py > pi5-prepare.log 2>&1
          python3 tools/test_pi5_firmware_inputs.py > pi5-firmware-inputs.log 2>&1
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pi5-model-results
          path: |
            qemu-build.log
            pi5-*.log
            _build/pi5-memory/
